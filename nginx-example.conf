# Replace all example values. Place map in nginx http {} scope.
map $http_origin $xiaola_origin_ok {
    default 0;
    "" 1;
    "https://xiaola.example.com" 1;
}
server {
    listen 443 ssl;
    server_name xiaola.example.com;
    ssl_certificate /etc/ssl/xiaola/fullchain.pem;
    ssl_certificate_key /etc/ssl/xiaola/privkey.pem;
    auth_basic "XiaoLa test";
    auth_basic_user_file /etc/nginx/xiaola.htpasswd;
    client_max_body_size 6m;
    if ($xiaola_origin_ok = 0) { return 403; }
    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host 127.0.0.1:8098;
        proxy_set_header Origin http://127.0.0.1:8098;
        proxy_set_header Authorization "";
        proxy_read_timeout 90s;
    }
}
