<body class="saas-body orders-page">
  <div class="saas-top"><b>◈ <span id="industry">园区</span>业务工作台</b><span>测试环境 · 示例工作台</span></div>
  <div class="saas-layout">
    <aside class="saas-menu"><span>工作台</span><span>业务管理</span><b>订单列表</b><a class="menu-link" href="suppliers.html">供应商管理</a><span>客户管理</span></aside>
    <main class="saas-main order-main">
      <div class="saas-heading order-heading"><div><small>WORKSPACE / 业务管理</small><h1>订单列表</h1><p>查看和管理订单，让小拉协助处理订单业务。</p></div><span class="mode">测试环境</span></div>
      <section class="order-panel" aria-label="订单列表">
        <div class="order-panel-head"><div><span class="order-kicker">ORDERS / 订单管理</span><h2>业务订单 <span id="order-count">0</span></h2><p>选择订单，查看相关业务或交给小拉处理。</p></div><button id="add-order" type="button" disabled>＋ 新增订单</button></div>
        <div class="order-toolbar"><label class="order-store">当前门店<select id="demo-store" aria-label="选择门店" disabled></select></label><label class="order-search"><span>搜索订单</span><input id="order-search" type="search" placeholder="搜索订单号或商品名称" autocomplete="off"></label><span class="order-origin">示例工作台</span></div>
        <div class="order-table-wrap"><table class="order-table"><thead><tr><th>业务订单号</th><th>商品 / 业务</th><th>订单金额</th><th>支付关联</th><th>来源</th><th>操作</th></tr></thead><tbody id="order-rows"><tr><td colspan="6" class="order-empty">正在加载订单…</td></tr></tbody></table></div>
        <div class="order-panel-foot"><span id="order-hint" aria-live="polite">订单状态以业务系统为准</span><span id="storage-hint">新增订单保存在当前浏览器</span></div>
      </section>
      <p class="order-disclaimer">本工作台为测试演示；新增订单只在浏览器保存，不代表创建了支付订单或完成商户授权。</p>
    </main>
  </div>
